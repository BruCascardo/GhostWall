# Integración continua (ADR 0012). Solo verifica: no hace commit, push, publicación ni despliegue.
# Las acciones se fijan por SHA de commit completo; la versión se indica en el comentario.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# Solo lectura del repositorio: ninguna verificación necesita escribir.
permissions:
  contents: read

# Un push nuevo a la misma rama (o al mismo PR) cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # No instalar hooks de Git en el runner.
  HUSKY: '0'
  # uv falla si uv.lock no coincide con pyproject.toml, en lugar de reescribirlo.
  UV_LOCKED: '1'

jobs:
  verify:
    name: Formato, lint, tipos, build y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: services/ml/uv.lock

      - run: npm ci
      - run: npm run ml:sync
      # Igual que la verificación local: verify:js + verify:ml + test:unit (docs/development.md).
      - run: npm run verify

  integracion:
    name: Pruebas de integración (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # PostgreSQL descartable creado por Testcontainers con el Docker del runner (docs/testing.md).
      - run: npm run test:integration

  e2e:
    name: Pruebas end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e

      # Trazas de Playwright solo si falla (datos sintéticos). Artefacto interno de Actions, no un despliegue.
      - name: Guardar resultados de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
