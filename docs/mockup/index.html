<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhostWall · Mockup navegable</title>
<!--
  Mockup navegable de GhostWall (prototipo de validación, sin funcionalidad real).
  Todos los datos son sintéticos y viven en memoria: al recargar la página vuelven al estado inicial.
  Requiere conexión a internet solo para las tipografías y ECharts (jsDelivr).
  Ver docs/mockup/README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --rubi:#A50F26; --profundo:#5E0A16; --tinta:#121212; --hueso:#ECE8E1; --papel:#F6F4EF;
  --niebla:#C9C4BB; --grafito:#5E5953; --blanco:#FFFDF9;
  --ok:#2E7D4F; --ok-bg:#E3F0E7; --warn:#B26A00; --warn-bg:#FBEFD9; --crit:#A50F26; --crit-bg:#F7E1E4;
  --info:#2F5D8A; --info-bg:#E2EBF4; --muted:#8A847C; --line:#DDD8CF;
  --f-head:'Anton',Impact,sans-serif; --f-acc:'Instrument Serif',Georgia,serif;
  --f-text:'Inter',system-ui,sans-serif; --f-mono:'Space Mono',ui-monospace,monospace;
  --r:10px; --shadow:0 1px 2px rgba(18,18,18,.06),0 4px 14px rgba(18,18,18,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font:14px/1.5 var(--f-text);-webkit-font-smoothing:antialiased}
a{color:var(--rubi)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
h1{font-size:28px;line-height:1.1} h2{font-size:18px} h3{font-size:15px}
.acc{font-family:var(--f-acc);font-style:italic;text-transform:none;letter-spacing:0;font-weight:400}
.mono{font-family:var(--f-mono)} .muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.nowrap{white-space:nowrap} .right{text-align:right} .center{text-align:center}
.hidden{display:none!important}

/* Barra de demostración */
#demobar{position:relative;z-index:50;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 16px;background:var(--tinta);color:var(--hueso);font-size:12px}
#demobar .tag{font-family:var(--f-mono);background:var(--rubi);color:#fff;padding:2px 8px;border-radius:4px;letter-spacing:.06em}
#demobar label{display:flex;align-items:center;gap:6px;color:var(--niebla)}
#demobar select{background:#222;border:1px solid #444;color:var(--hueso);border-radius:6px;padding:3px 6px}
#demobar button{background:transparent;border:1px solid #444;color:var(--hueso);border-radius:6px;padding:3px 10px;cursor:pointer}
#demobar button:hover{border-color:var(--niebla)}
#demobar .sp{flex:1}

/* Layout */
#app{display:flex;min-height:100vh}
#sidebar{width:248px;flex:none;background:var(--tinta);color:var(--hueso);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
#sidebar .brand b{font-family:var(--f-head);font-size:22px;letter-spacing:.04em;font-weight:400}
#sidebar .tenant{margin:0 12px 10px;padding:10px 12px;border:1px solid #2c2c2c;border-radius:8px;font-size:12px}
#sidebar .tenant .mono{color:var(--niebla);font-size:11px}
#sidebar nav{padding:4px 8px 20px}
#sidebar .grp{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:#8b857d;padding:14px 10px 6px;text-transform:uppercase}
#sidebar a.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--hueso);text-decoration:none;font-size:13.5px}
#sidebar a.it:hover{background:#1f1f1f}
#sidebar a.it.on{background:var(--rubi);color:#fff}
#sidebar a.it .ic{width:18px;text-align:center;opacity:.9}
#sidebar a.it .lock{margin-left:auto;font-size:11px;opacity:.6}
#sidebar a.it .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:#2a2a2a;border-radius:10px;padding:0 7px}
#sidebar a.it.on .cnt{background:rgba(255,255,255,.2)}
#sidebar .foot{margin-top:auto;padding:14px 18px;border-top:1px solid #222;font-size:12px;color:var(--niebla)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--papel);position:sticky;top:0;z-index:20}
#topbar .crumbs{font-size:12px;color:var(--muted)}
#topbar .sp{flex:1}
#topbar .search{border:1px solid var(--line);background:var(--blanco);border-radius:8px;padding:6px 10px;width:240px}
#topbar .ibtn{position:relative;border:1px solid var(--line);background:var(--blanco);border-radius:8px;padding:6px 10px;cursor:pointer}
#topbar .ibtn .dot{position:absolute;top:-5px;right:-5px;background:var(--rubi);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;font-family:var(--f-mono)}
#topbar .who{display:flex;align-items:center;gap:8px;font-size:12px}
#topbar .av{width:30px;height:30px;border-radius:50%;background:var(--profundo);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}
#burger{display:none}
#view{padding:22px 24px 60px;max-width:1440px;width:100%}

/* Anotaciones de requisitos */
#annot{margin:14px 24px 0;padding:8px 12px;border:1px dashed var(--niebla);border-radius:8px;background:#FAF8F3;font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#annot b{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--grafito);margin-right:4px}
.req{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--hueso);color:var(--grafito);cursor:help}
.amb{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);cursor:help;border:1px solid #f0d7a8}
body.no-annot #annot,body.no-annot .note{display:none!important}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:0 8px 8px 0;font-size:12.5px;margin:10px 0;color:#5a3b00}
.note.info{border-color:var(--info);background:var(--info-bg);color:#1d3b58}

/* Componentes */
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--grafito);max-width:760px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-12{grid-template-columns:1fr 2fr} .g-21{grid-template-columns:2fr 1fr} .g-31{grid-template-columns:3fr 1.3fr}
.span2{grid-column:span 2} .span3{grid-column:span 3}
.g-pb{grid-template-columns:260px 1fr 280px} .g-mail{grid-template-columns:minmax(240px,340px) 1fr}
.card{background:var(--blanco);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card>.ch{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.card>.ch h3{display:flex;gap:8px;align-items:center}
.kpi .lbl{font-size:12px;color:var(--grafito)}
.kpi .val{font-family:var(--f-mono);font-size:26px;font-weight:700;line-height:1.2;margin-top:4px}
.kpi .dl{font-size:12px;font-family:var(--f-mono)}
.up-bad{color:var(--crit)} .down-good{color:var(--ok)} .up-good{color:var(--ok)} .down-bad{color:var(--crit)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--blanco);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--tinta);font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--grafito)}
.btn.pri{background:var(--rubi);border-color:var(--rubi);color:#fff}
.btn.pri:hover{background:var(--profundo)}
.btn.dark{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--crit);border-color:#e5b3bb}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--hueso);color:var(--grafito)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip.dark{background:var(--tinta);color:var(--hueso)} .chip.out{background:transparent;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grafito);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid #ECE8E1;vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#FAF7F1}
.tw{overflow-x:auto}
.bar{height:7px;background:var(--hueso);border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--grafito);font-weight:500;white-space:nowrap}
.tabs button.on{border-color:var(--rubi);color:var(--tinta)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:12px;font-weight:600;color:var(--grafito)}
.field small{color:var(--muted);font-size:11.5px}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;width:100%}
.inp:focus{outline:2px solid rgba(165,15,38,.25);border-color:var(--rubi)}
.inp.bad{border-color:var(--crit);background:#fff7f8}
.err{color:var(--crit);font-size:12px} .okt{color:var(--ok);font-size:12px}
.chart{width:100%;height:280px}
.chart.sm{height:200px} .chart.lg{height:340px}
.empty-chart{display:grid;place-items:center;height:100%;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:#fff;position:relative}
.opt:hover{border-color:var(--grafito)} .opt.on{border-color:var(--rubi);box-shadow:0 0 0 3px rgba(165,15,38,.1)}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt .t1{font-weight:700} .opt .t2{font-size:12px;color:var(--grafito)}
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps div{flex:1;min-width:120px;padding:8px 10px;border-top:3px solid var(--line);font-size:12px;color:var(--muted)}
.steps div.on{border-color:var(--rubi);color:var(--tinta);font-weight:600}
.steps div.done{border-color:var(--profundo);color:var(--grafito)}
.list{display:flex;flex-direction:column}
.list .li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #ECE8E1;align-items:flex-start}
.list .li:last-child{border-bottom:0}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--hueso);font-size:13px}
.ico.crit{background:var(--crit-bg);color:var(--crit)} .ico.ok{background:var(--ok-bg);color:var(--ok)} .ico.warn{background:var(--warn-bg);color:var(--warn)} .ico.info{background:var(--info-bg);color:var(--info)}
.toggle{position:relative;width:36px;height:20px;flex:none;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle i{position:absolute;inset:0;background:var(--niebla);border-radius:20px;cursor:pointer;transition:.2s}
.toggle i:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+i{background:var(--rubi)} .toggle input:checked+i:before{transform:translateX(16px)}
.lockcard{max-width:620px;margin:40px auto;text-align:center;padding:40px 28px}
.lockcard .big{font-size:40px}
.hash{font-family:var(--f-mono);font-size:11.5px;color:var(--grafito)}
mark.flag{background:#FBE3B8;border-bottom:2px solid var(--warn);padding:0 2px;border-radius:2px;cursor:help}
mark.flag.c{background:#F7D3D9;border-color:var(--crit)}
.mail{border:1px solid var(--line);border-radius:10px;background:#fff}
.mail .mh{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}
.mail .mb{padding:16px;font-size:14px;line-height:1.65}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--grafito)} .kv dd{margin:0}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.timeline .ev{position:relative;padding-bottom:14px}
.timeline .ev:before{content:'';position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--niebla);border:2px solid var(--blanco)}
.timeline .ev.crit:before{background:var(--crit)} .timeline .ev.ok:before{background:var(--ok)} .timeline .ev.warn:before{background:var(--warn)} .timeline .ev.info:before{background:var(--info)}
.flow{display:flex;flex-direction:column;gap:0;align-items:stretch}
.blk{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;display:flex;gap:10px;align-items:center}
.blk.trg{border-color:var(--info);background:var(--info-bg)} .blk.cnd{border-color:var(--warn);background:var(--warn-bg)} .blk.act{border-color:var(--rubi);background:#FBF0F2}
.blk .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:transparent}
.conn{width:2px;height:16px;background:var(--niebla);margin-left:24px}
.palette .blk{cursor:grab;margin-bottom:8px}
.drop{border:2px dashed var(--niebla);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.drop.over{border-color:var(--rubi);background:#FBF0F2;color:var(--rubi)}
.heat-legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--grafito)}
.badge{width:96px;text-align:center;font-size:12px}
.badge .md{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--hueso);border:2px solid var(--line)}
.badge.got .md{background:#FBF0F2;border-color:var(--rubi)}
.badge:not(.got){opacity:.45}
.path{display:flex;flex-direction:column;gap:0}
.path .st{display:flex;gap:14px;align-items:flex-start}
.path .st .n{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--hueso);border:2px solid var(--line)}
.path .st.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.path .st.cur .n{background:var(--rubi);border-color:var(--rubi);color:#fff}
.path .ln{width:2px;height:18px;background:var(--line);margin-left:16px}
.phone{width:260px;margin:0 auto;border:10px solid var(--tinta);border-radius:30px;background:#f2f2f2;padding:22px 12px;min-height:320px}
.bub{background:#fff;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13px;box-shadow:var(--shadow)}
.player{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:30px;padding:6px 12px;background:#fff}
.wave{flex:1;height:28px;background:repeating-linear-gradient(90deg,var(--niebla) 0 2px,transparent 2px 5px);mask:linear-gradient(90deg,#000 0,#000 100%);border-radius:4px;opacity:.8}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--rubi);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}

/* Modal y toasts */
#modal-root .bg{position:fixed;inset:0;background:rgba(18,18,18,.55);z-index:100;display:grid;place-items:center;padding:16px}
#modal-root .md{background:var(--blanco);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal-root .md.wide{max-width:820px}
#modal-root .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#modal-root .mbd{padding:18px 20px}
#modal-root .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast-root{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--tinta);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);max-width:380px;border-left:4px solid var(--niebla);animation:tin .2s}
.toast.ok{border-color:#5fbf86} .toast.crit{border-color:#ff5a72} .toast.warn{border-color:#f0b252}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#notifpanel{position:fixed;top:64px;right:20px;width:380px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;z-index:60;background:var(--blanco);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:6px 14px}

/* Pantallas completas (login, landing de simulación, cuarentena) */
.full{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px}
.login{display:grid;grid-template-columns:1.1fr 1fr;max-width:1060px;width:100%;background:var(--blanco);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.login .l{background:var(--tinta);color:var(--hueso);padding:44px}
.login .r{padding:36px}
.login h1{font-size:46px;color:#fff}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:42px;height:48px;text-align:center;font-family:var(--f-mono);font-size:20px;border:1px solid var(--line);border-radius:8px}

@media (max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g-31,.g-21,.g-12,.g-pb{grid-template-columns:1fr}}
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:transform .2s}
  body.nav-open #sidebar{transform:none}
  #burger{display:inline-flex}
  .g2,.g3,.g-mail{grid-template-columns:1fr} .span2,.span3{grid-column:auto}
  #topbar .search{display:none}
  .login{grid-template-columns:1fr}
}
@media (max-width:560px){
  .g4,.g6{grid-template-columns:1fr}
  #view{padding:16px 16px 60px} #topbar{padding:10px 16px} #annot{margin:10px 16px 0}
  .kv{grid-template-columns:1fr}
  #topbar .who span{display:none}
}
</style>
</head>
<body>
<div id="demobar">
  <span class="tag">MOCKUP</span>
  <span>Datos sintéticos · sin funcionalidad real</span>
  <span class="sp"></span>
  <label>Ver como
    <select id="sel-role" onchange="App.setRole(this.value)">
      <option value="admin">Administrador de Seguridad (CISO/SOC)</option>
      <option value="empleado">Empleado</option>
      <option value="auditor">Auditor</option>
      <option value="ventas">Ejecutivo de Ventas (GhostWall)</option>
    </select>
  </label>
  <label>Plan de la empresa
    <select id="sel-plan" onchange="App.setPlan(this.value)">
      <option value="STARTER">Starter</option>
      <option value="PROFESIONAL">Profesional</option>
      <option value="ENTERPRISE" selected>Enterprise</option>
    </select>
  </label>
  <label><input type="checkbox" id="chk-annot" checked onchange="App.setAnnot(this.checked)"> Anotaciones de requisitos</label>
  <button onclick="App.go('guia')">Guía del mockup</button>
  <button onclick="App.go('login')">Pantalla de ingreso</button>
  <button onclick="App.reset()">Reiniciar datos</button>
</div>
<div id="app">
  <aside id="sidebar"></aside>

function modal(title, body, actions = [{ label: 'Cerrar' }], wide = false) {

}

/* ---------- Render ---------- */
function parseRoute() { const [name, ...rest] = (location.hash.replace(/^#\/?/, '') || 'guia').split('/'); return { name, param: decodeURIComponent(rest.join('/')) }; }
function render() {
  const { name, param } = parseRoute();
  const v = V[name] || V.notfound;
  const changed = lastRoute !== location.hash; lastRoute = location.hash;
  disposeCharts(); $('#notifpanel').classList.add('hidden'); document.body.classList.remove('nav-open');
  const full = !!v.full;
  ['#sidebar', '#topbar'].forEach((s) => $(s).classList.toggle('hidden', full));
  let html, ok = true;
  if (v.roles && !v.roles.includes(S.role)) { html = forbidden(v); ok = false; }

  $('#view').style.maxWidth = full ? 'none' : ''; $('#view').style.padding = full ? '0' : '';

  if (changed) window.scrollTo(0, 0);

function forbidden(v) { return `<div class="card lockcard"><div class="big">⛔</div><h2>Sin permiso para esta pantalla</h2><p>El rol <b>${ROLES[S.role].n}</b> no tiene acceso a <b>${title(v, '')}</b>. El control de acceso por roles (RBAC) se aplica en <span class="mono">api</span>, no solo en la interfaz (RF-020, RNF-005).</p><a class="btn pri" href="#/${ROLES[S.role].home}">Volver al inicio</a></div>`; }

  reset() { const r = S.role, p = S.plan; S = seed(); S.role = r; S.plan = p; render(); toast('Datos de ejemplo reiniciados', 'ok'); },

}
const finInts = (list) => list.filter((x) => x.res !== 'PENDIENTE');

const allInts = () => S.camps.flatMap((c) => c.intentos.map((x) => Object.assign({ camp: c }, x)));
const semanas = () => Array.from({ length: 12 }, (_, k) => fd(ago((11 - k) * 7 * 1440), false).slice(0, 5));
function heatData() {
  const tipos = Object.keys(TIPOS), out = [];
  AREAS.forEach((a, yi) => tipos.forEach((t, xi) => {

A.verificarRep = () => {
  const txt = ($('#ver-in').value || '').trim(); S.ui.verIn = txt; let hash = txt;

A.reportar = () => {

  setTimeout(() => {
    const txt = f.asunto + ' ' + f.cuerpo, gat = {}; GATILLOS.forEach((g) => { const m = (txt.match(new RegExp(DETECT[g].source, 'gi')) || []).length; gat[g] = Math.min(0.97, m ? 0.45 + m * 0.2 : 0.03 + (txt.length % 7) / 100); });

    const sos = Object.values(gat).filter((v) => v > 0.5).length >= 1 && (cred || Object.values(gat).filter((v) => v > 0.5).length >= 2);
    const id = 'INC-' + (1100 + S.seq++);
    S.incs.unshift({ id, asunto: f.asunto || '(sin asunto)', de: f.de || '(desconocido)', fecha: now(), rep: S.meIdx, clasif: sos ? 'SOSPECHOSO' : 'NO_SOSPECHOSO', conf: sos ? 0.89 : 0.84, gat, prior: sos ? 'CRITICA' : 'BAJA', estado: sos ? 'ESCALADO' : 'CERRADO', mitre: sos ? 'T1598.003' : '—', origen: 'EXTERNO', cuerpo: esc(f.cuerpo) });
    S.misReportes.unshift({ id, asunto: f.asunto || '(sin asunto)', fecha: now(), res: sos ? 'Sospechoso: escalado al equipo de seguridad.' : 'Legítimo: cerrado como falso positivo.', k: sos ? 'ok' : '' });
    audit('REPORT_RECEIVED', sos ? 'INCIDENT_ESCALATED' : 'CLOSED_FALSE_POSITIVE', me().hash);
    if (sos) notify('admin', 'crit', `Incidente ${id} escalado: correo sospechoso con prioridad CRÍTICA.`, 'incidentes/' + id);
    S.ui.repRes = { sos, gat, id }; rerender();
  }, 1400);
};

A.facEstado = (id, est) => { const x = S.facturas.find((f) => f.id === id); x.estado = est; const e = empresa(x.cuit); if (est === 'RECHAZADA' && e.estado === 'ACTIVO') { A.empEstado(e.cuit, 'SUSPENDIDO'); return; } if (est === 'PAGADA' && e.estado === 'SUSPENDIDO' && !S.facturas.some((f) => f.cuit === e.cuit && f.estado === 'RECHAZADA')) { e.estado = 'ACTIVO'; toast(`${e.rs} regularizó su deuda y volvió a ACTIVO.`, 'ok'); } rerender(); };
A.emitir = () => { let n = 0; S.empresas.filter((e) => e.estado === 'ACTIVO' && !e.prueba && e.mod === 'MENSUAL').forEach((e) => { if (!S.facturas.some((f) => f.cuit === e.cuit && f.per === '2026-11')) { S.facturas.push(mkFactura(e, '2026-11', 'EMITIDA', 9500 + S.seq++)); n++; } }); toast(n ? `Se emitieron ${n} facturas y se enviaron por correo (RF-006).` : 'Las facturas de noviembre ya estaban emitidas.', n ? 'ok' : 'warn'); rerender(); };
V.planes = {
  title: 'Planes y precios', roles: ['ventas'], req: ['RF-003', 'RF-005', 'RF-010', 'RF-011'], amb: ['AMB-31'],
  render() {
    const c = S.ui.calc || (S.ui.calc = { plan: 'PROFESIONAL', us: 80, mod: 'MENSUAL' }); const pl = PLANS[c.plan], md = MODALIDADES[c.mod];
    const meses = c.mod === 'MENSUAL' ? 1 : c.mod === 'ANUAL_PREPAGA' ? 12 : 24, tot = r1(pl.precio * c.us * meses * (1 - md.dto));
    return head('Planes y precios', 'Catálogo comercial (D4 §6.2.2) y calculadora de cotización.') +
      `<div class="grid g-21"><div>${card('', `<div class="tw"><table class="t"><thead><tr><th>Característica</th><th>Starter</th><th>Profesional</th><th>Enterprise</th></tr></thead><tbody>${PLAN_FEATS.map((r) => `<tr>${r.map((x, i) => `<td class="${i ? 'small' : ''}">${i === 0 ? `<b>${x}</b>` : x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}</div>
      <div>${card('Calculadora', `<div class="field"><span>Plan</span><select class="inp" onchange="S.ui.calc.plan=this.value;rerender()">${Object.entries(PLANS).map(([k, p]) => `<option value="${k}" ${c.plan === k ? 'selected' : ''}>${p.nombre}</option>`).join('')}</select></div><div class="field"><span>Usuarios</span><input type="number" class="inp ${c.us < pl.min ? 'bad' : ''}" value="${c.us}" onchange="S.ui.calc.us=+this.value;rerender()">${c.us < pl.min ? `<span class="err">Mínimo ${pl.min}</span>` : ''}</div><div class="field"><span>Modalidad</span><select class="inp" onchange="S.ui.calc.mod=this.value;rerender()">${Object.entries(MODALIDADES).map(([k, m]) => `<option value="${k}" ${c.mod === k ? 'selected' : ''}>${m.n}</option>`).join('')}</select></div><dl class="kv"><dt>Mensual base</dt><dd class="mono">${fmtUSD(pl.precio * c.us)}</dd><dt>Total ${meses} ${meses === 1 ? 'mes' : 'meses'}</dt><dd class="mono"><b>${fmtUSD(tot)}</b></dd><dt>En ARS</dt><dd class="mono">${fmtARS(r1(tot * TC_BNA))}</dd></dl>` + note('Enterprise: mínimo garantizado de USD 14 por usuario, con descuentos adicionales desde 500 usuarios. Prueba gratuita: Starter, 30 días, 15 usuarios.', 'info'))}</div></div>`;
  },
};
V.tickets = {
  title: 'Tickets de soporte', roles: ['ventas'], req: ['RF-066'], amb: ['AMB-21', 'AMB-22'],
  render: () => head('Tickets de soporte', 'Consultas y fallas de todas las empresas, con triage y escalamiento a las áreas de GhostWall.') + card('', table(['Ticket', 'Empresa', 'Tipo', 'Asunto', 'Prioridad', 'Área', 'Estado', 'Abierto', ''], S.tickets.map((t, i) => [`<span class="mono">${t.id}</span>`, esc(empresa(t.cuit).rs), t.tipo, esc(t.asunto), chip(t.prior, t.prior === 'ALTA' ? 'crit' : ''), `<select class="inp" style="padding:3px 6px" onchange="S.tickets[${i}].area=this.value;toast('Ticket reasignado a '+this.value)">${['Soporte N1', 'Plataforma', 'Inteligencia Artificial', 'Cumplimiento', 'Comercial'].map((a) => `<option ${t.area === a ? 'selected' : ''}>${a}</option>`).join('')}</select>`, estChip(t.estado), `<span class="small">${rel(t.fecha)}</span>`, `<button class="btn sm" onclick="A.responder(${i})">Responder</button>`]))) + note('Propuesta: las áreas internas de GhostWall (IA, Plataforma) solo aplican a tickets de soporte, no a los incidentes de phishing del cliente (AMB-21).'),
};
A.responder = (i) => { const t = S.tickets[i]; modal('Responder ' + t.id, `<p class="small muted">${esc(t.asunto)}</p><textarea class="inp" rows="5" placeholder="Respuesta al cliente"></textarea><div class="field" style="margin-top:10px"><span>Estado</span><select class="inp" id="m-ts"><option>RESPONDIDO</option><option>ESCALADO</option><option>CERRADO</option></select></div>`, [{ label: 'Cancelar' }, { label: 'Enviar', kind: 'pri', fn: () => { t.estado = $('#m-ts').value; toast('Respuesta enviada (simulada).', 'ok'); rerender(); } }]); };

/* =====================================================================
   INGRESO, GUÍA E INICIO
   ===================================================================== */
V.login = {
  full: true, title: 'Ingreso', req: ['RF-016', 'RF-017', 'RF-018', 'RNF-006'], amb: ['AMB-02', 'AMB-28'],
  render() {
    const l = S.ui.login || (S.ui.login = { role: 'admin', step: 1 });
    const r = { admin: ['Administrador de Seguridad', 'CISO / SOC de la empresa cliente', 'c.ibarra'], empleado: ['Empleado', 'Portal de capacitación', 'm.sosa'], auditor: ['Auditor', 'Evidencia y cumplimiento, solo lectura', 'auditoria.rios'], ventas: ['Ejecutivo de Ventas', 'Personal interno de GhostWall', 't.gimenez'] };
    if (l.step === 2) return `<div class="full" style="background:#e9ebee"><div style="background:#fff;max-width:420px;width:100%;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.12);padding:30px;font-family:Arial,sans-serif"><div class="tiny mono" style="color:#777">Keycloak · realm ghostwall-metalurgica</div><h2 style="font-family:Arial;text-transform:none;margin:8px 0 18px;font-size:22px">Iniciá sesión en tu cuenta</h2>${l.err ? `<div class="note" style="margin-bottom:14px">${l.err}</div>` : ''}<label class="small">Usuario</label><input class="inp" value="${r[l.role][2]}" readonly style="margin:4px 0 12px"><label class="small">Contraseña</label><input class="inp" type="password" placeholder="(demo: no hace falta escribirla)" autocomplete="off" style="margin:4px 0 18px"><button class="btn pri" style="width:100%;justify-content:center" onclick="A.ingresar()">Iniciar sesión</button><p class="small center" style="margin-top:14px"><a href="javascript:void(0)" onclick="S.ui.login.err='Tu cuenta no está habilitada para ingresar. Avisamos al Administrador de Seguridad de tu empresa (RF-018).';rerender()">Simular cuenta suspendida</a> · <a href="javascript:void(0)" onclick="S.ui.login.step=1;S.ui.login.err=null;rerender()">Volver</a></p><p class="tiny muted" style="margin-top:14px">Pantalla del proveedor de identidad, no de GhostWall: GhostWall nunca ve ni guarda la contraseña (RNF-006, ADR 0008).</p></div></div>`;
    return `<div class="full"><div class="login"><div class="l"><div class="row">${logo(42)}<b style="font-family:var(--f-head);font-size:26px;letter-spacing:.05em">GHOSTWALL</b></div><h1 style="margin-top:60px">DEL ESLABÓN MÁS DÉBIL</h1><p class="acc" style="font-size:30px;margin:6px 0 0;color:var(--hueso)">a la primera línea de defensa.</p><p style="margin-top:40px;color:var(--niebla);max-width:400px">Simulaciones de phishing con IA, triage semántico, scoring de riesgo, capacitación adaptativa, respuesta automatizada y auditoría inmutable.</p><p class="mono tiny" style="margin-top:60px;color:#8b857d">PROYECTO FINAL · UTN FRRO · 2026 · MOCKUP</p></div>
      <div class="r"><h2>Ingresar</h2><p class="small muted">Elegí con qué rol querés recorrer el mockup.</p><div class="flow" style="gap:10px;margin:18px 0">${Object.entries(r).map(([k, v]) => `<div class="opt ${l.role === k ? 'on' : ''}" onclick="S.ui.login.role='${k}';rerender()"><div class="t1">${v[0]}</div><div class="t2">${v[1]}</div></div>`).join('')}</div><button class="btn pri" style="width:100%;justify-content:center" onclick="S.ui.login.step=2;rerender()">Continuar con el inicio de sesión de tu empresa (SSO)</button><p class="tiny muted" style="margin-top:12px">Login delegado al proveedor de identidad con Authorization Code Flow (RF-016).</p></div></div></div>`;
  },
};
A.ingresar = () => { const r = S.ui.login.role; S.ui.login = null; audit('LOGIN_SUCCESS', 'SESSION_CREATED'); App.setRole(r); toast('Sesión iniciada como ' + ROLES[r].n, 'ok'); };
V.guia = {
  title: 'Guía del mockup', req: [], amb: [],
  render() {
    const T = [
      ['ventas', 'alta', 'Dar de alta una empresa', 'CUIT validado, plan, modalidad, contrato e invitación al Administrador.'],
      ['ventas', 'facturacion', 'Simular un pago rechazado', 'La empresa pasa a SUSPENDIDO; al registrar el pago vuelve a ACTIVO.'],
      ['admin', 'panel', 'Leer el panel de riesgo', 'Velocímetro, mapa de calor por área y tipo de ataque, tendencia y a quién apoyar.'],
      ['admin', 'campanas/nueva', 'Crear una simulación con IA', 'Tipo, objetivo, gatillo, técnica MITRE, contenido generado y programación.'],
      ['empleado', 'correo', 'Caer (o no) en una simulación', 'Abrí "URGENTE: transferencia…", hacé clic en el enlace o reportalo, y mirá el feedback.'],
      ['empleado', 'reportar', 'Reportar un correo sospechoso', 'El triage detecta gatillos; si es sospechoso, el Administrador recibe una alerta.'],
      ['empleado', 'cursos/k3', 'Hacer un microcurso', 'Video, cuestionario, logro o reintento sin penalización.'],
      ['admin', 'respuesta', 'Probar un playbook de respuesta', 'Ejecutá "Contención crítica" y simulá un rechazo del proveedor de identidad.'],
      ['admin', 'respuesta/p3', 'Editar un playbook con arrastrar y soltar', 'Solo en Enterprise: disparadores, condiciones y acciones.'],
      ['auditor', 'auditoria', 'Exportar y verificar evidencia', 'Exportá con MFA, descargá el JSON y verificalo en "Verificar reporte".'],
      ['admin', 'configuracion', 'Ajustar el motor de riesgo', 'Pesos de la fórmula y umbrales; se recalculan todos los scores.'],
    ];
    const pantallas = []; Object.entries(NAV).forEach(([r, gs]) => gs.forEach(([, items]) => items.forEach(([k, , n]) => { const v = V[k]; if (!v) return; const rq = typeof v.req === 'function' ? v.req('') : v.req || []; pantallas.push([ROLES[r].n, n, rq]); })));
    const ambs = new Set(); Object.values(V).forEach((v) => { ['', 'x', 'nueva', 'landing'].forEach((p) => (typeof v.amb === 'function' ? v.amb(p) : v.amb || []).forEach((a) => ambs.add(a))); });
    return head('Guía del mockup', `Prototipo navegable de <b>GhostWall</b> para validar qué debe hacer la aplicación antes de implementarla. <span class="acc">Nada es real:</span> no se envían correos, no hay IA ni base de datos y los hashes son simulados.`) +
      `<div class="grid g3" style="margin-bottom:16px">${card('1. Elegí un rol', '<p class="small">Arriba, en <b>Ver como</b>: Administrador de Seguridad, Empleado, Auditor o Ejecutivo de Ventas. Cada rol ve su propio menú (RBAC).</p>')}${card('2. Probá los planes', '<p class="small">Con <b>Plan de la empresa</b> se habilitan o bloquean módulos (vishing, respuesta automatizada, SIEM, tendencias, playbooks personalizados).</p>')}${card('3. Leé las anotaciones', '<p class="small">Cada pantalla muestra los <span class="req">RF</span> que cubre y las <span class="amb">AMB</span> abiertas que la afectan. Se ocultan con la casilla de la barra superior.</p>')}</div>` +
      card('Recorridos sugeridos', `<div class="grid g2">${T.map(([r, ruta, t, d]) => `<div class="li row" style="align-items:flex-start;border-bottom:1px solid #ECE8E1;padding:10px 0"><div style="flex:1"><b>${t}</b> <span class="chip out">${ROLES[r].n}</span><div class="small muted">${d}</div></div><button class="btn sm pri" onclick="S.role='${r}';$('#sel-role').value='${r}';location.hash='#/${ruta}';render()">Ir →</button></div>`).join('')}</div>`) +
      `<div class="grid g2" style="margin-top:16px">${card('Decisiones abiertas que el mockup hace visibles', `<div class="list">${[...ambs].sort().map((a) => `<div class="li"><span class="amb">${a}</span><span class="small">${esc(AMB[a] || '')}</span></div>`).join('')}</div>`)}
        ${card('Propuestas del mockup a validar', `<ul class="small" style="padding-left:18px;margin:0;line-height:1.7"><li>El empleado ve un "nivel de protección" positivo, no su score de riesgo.</li><li>El Administrador puede revelar el contacto de un empleado con MFA y queda auditado.</li><li>Los tickets de soporte van separados de los reportes de phishing.</li><li>Complemento "Reportar phishing" en Outlook/Gmail.</li><li>Estados de factura EMITIDA / PAGADA / RECHAZADA.</li><li>Gestión de contenido de cursos (ABM) por el Administrador.</li><li>Ranking de gamificación solo por áreas.</li><li>Matriz de permisos por rol (Usuarios y accesos → Roles y permisos).</li><li>Reporte de una simulación de GhostWall = RESISTIÓ.</li></ul>`)}</div>` +
      `<div style="margin-top:16px">${card('Pantallas y requisitos', table(['Rol', 'Pantalla', 'Requisitos'], pantallas.map((p) => [p[0], p[1], req(p[2])])))}</div>`;
  },
};

window.addEventListener('hashchange', render);
render();
</script>
